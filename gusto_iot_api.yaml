components:
  schemas:
    login:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      example:
        email: admin@gusto.com
        password: Admin12345
    create_manager:
      type: object
      properties:
        fullName:
          type: string
        email:
          type: string
        password:
          type: string
        passwordConfirm:
          type: string
      example:
        fullName: manager2
        email: manager2@example.com
        password: password123
        passwordConfirm: password123
    update_manager:
      type: object
      properties:
        email:
          type: string
      example:
        email: manager2@example.com
    update_status:
      type: object
      properties:
        status:
          type: string
      example:
        status: DISABLED
    create_project:
      type: object
      properties:
        batch:
          type: string
        projectStartDate:
          type: string
        projectManager:
          type: string
      example:
        batch: HND-60
        projectStartDate: '2026-11-01'
        projectManager: 6a73c97573aadccec3414e63
    update_project:
      type: object
      properties:
        theme:
          type: string
        projectShow:
          type: object
          properties:
            startDate:
              type: string
            startTime:
              type: string
            endTime:
              type: string
            location:
              type: object
              properties:
                campus:
                  type: string
                floor:
                  type: string
                room:
                  type: string
            votingCategories:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  description:
                    type: string
      example:
        theme: Smart and Sustainable Campus
        projectShow:
          startDate: '2026-12-15'
          startTime: '09:30'
          endTime: '16:30'
          location:
            campus: 209 Campus
            floor: Second Floor
            room: Room 9
          votingCategories:
            - name: Most Innovative
              description: >-
                Awarded to the group presenting the most original and innovative
                IoT solution.
            - name: Best Visual Presentation
              description: >-
                Awarded to the group with the clearest and most attractive
                project presentation.
            - name: Closest to Real World
              description: >-
                Awarded to the project that provides the most practical solution
                to a real-world problem.
            - name: Best Technical Implementation
              description: >-
                Awarded to the group demonstrating the strongest technical
                design and implementation.
    create_group:
      type: object
      properties:
        project:
          type: object
          properties:
            type:
              type: string
        groupNumber:
          type: object
          properties:
            type:
              type: string
        members:
          type: object
          properties:
            type:
              type: string
        title:
          type: object
          properties:
            type:
              type: string
        images:
          type: object
          properties:
            type:
              type: string
            items:
              type: object
              properties:
                type:
                  type: string
  requestBodies:
    login:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/login'
      description: ''
      required: true
    create_manager:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/create_manager'
      description: ''
      required: true
    update_manager:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/update_manager'
      description: ''
      required: true
    update_status:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/update_status'
      description: ''
      required: true
    create_project:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/create_project'
      description: ''
      required: true
    update_project:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/update_project'
      description: ''
      required: true
    create_group:
      content:
        multipart/form-data:
          schema:
            $ref: '#/components/schemas/create_group'
      description: ''
      required: true
  securitySchemes:
    get_all_managers:
      type: http
      scheme: bearer
    create_manager:
      type: http
      scheme: bearer
    get_manager_detail:
      type: http
      scheme: bearer
    update_manager:
      type: http
      scheme: bearer
    delete_manager:
      type: http
      scheme: bearer
    update_status:
      type: http
      scheme: bearer
    create_project:
      type: http
      scheme: bearer
    get_one_project:
      type: http
      scheme: bearer
    update_project:
      type: http
      scheme: bearer
    get_projects:
      type: http
      scheme: bearer
    delete_project:
      type: http
      scheme: bearer
    create_group:
      type: http
      scheme: bearer
    get_groups:
      type: http
      scheme: bearer
    delete_group:
      type: http
      scheme: bearer
